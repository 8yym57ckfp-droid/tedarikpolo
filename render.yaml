services:
  - type: web
    name: safepays
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: STAFF_SESSION_TTL_SECONDS
        value: "2592000"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: TEAM_ADMIN_EMAIL
        sync: false
      - key: TEAM_ADMIN_PASSWORD
        sync: false
      - key: TEAM_ADMIN_TOTP_SECRET
        sync: false
      - key: SYNTHETIC_FINANCE_SEED_ENABLED
        value: "true"
      - key: TRONGRID_API_KEY
        sync: false
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
