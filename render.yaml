services:
  - type: web
    name: safepays
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_POSTGRES
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
