<!doctype html><html lang="tr"><head><script>(function(){try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safepays Admin</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="admin.css"><script src="../assets/app.js"></script><script src="admin-store.js"></script><script src="admin-api.js"></script><link rel="stylesheet" href="../assets/dark-theme.css"><script src="../assets/maintenance.js"></script></head><body class="admin-body"><div class="admin-login"><div class="admin-card"><div class="logo">Safe<span>Pays</span></div><h1>Admin Girişi</h1><p class="admin-muted">Yönetici oturumu • Sunucu doğrulaması + 2FA</p><form id="f"><input id="email" type="email" placeholder="Yönetici e-postası" required><input id="password" type="password" placeholder="Şifre" required><input id="code" inputmode="numeric" maxlength="6" placeholder="Google Authenticator kodu" required><button class="admin-btn primary">Giriş Yap</button><div id="err" class="admin-muted"></div></form><div class="admin-login-note">Giriş bilgileri sunucuda doğrulanır. İki aşamalı doğrulama zorunludur.</div></div></div><script>
const form=document.getElementById('f'),errorBox=document.getElementById('err');
form.onsubmit=async event=>{
  event.preventDefault();errorBox.textContent='Yönetici oturumu doğrulanıyor…';
  try{const result=await adminLogin(document.getElementById('email').value,document.getElementById('password').value,document.getElementById('code').value);if(window.SafeAdmin?.setSessionProfile)SafeAdmin.setSessionProfile({id:result.admin.id,email:result.admin.email,role:'Super Admin',name:'Super Admin'});localStorage.setItem('safepays_portal','owner');location.href='dashboard.html';}
  catch(error){errorBox.textContent=error.message==='invalid_2fa_code'?'2FA kodu hatalı.':error.message==='invalid_admin_credentials'?'E-posta veya şifre hatalı.':error.message||'Yönetici girişi başarısız.';}
};
</script></body></html>
