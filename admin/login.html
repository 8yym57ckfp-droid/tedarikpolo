<!doctype html><html lang="tr"><head><script>document.documentElement.classList.add("admin-portal","dark-theme");try{localStorage.setItem("safepays-admin-theme","dark")}catch(e){}</script><script>(function(){try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safepays Admin</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="admin.css"><script src="../assets/app.js"></script><script src="admin-store.js"></script><script src="admin-api.js"></script><link rel="stylesheet" href="../assets/dark-theme.css"><script src="../assets/maintenance.js"></script></head><body class="admin-body"><div class="admin-login"><div class="admin-card"><div class="logo">Safe<span>Pays</span></div><h1>Admin Girişi</h1><p class="admin-muted">Yönetici oturumu • Sunucu doğrulaması + 2FA</p><form id="f"><input id="email" type="email" placeholder="Yönetici e-postası" required><input id="password" type="password" placeholder="Şifre" required><input id="code" inputmode="numeric" maxlength="6" placeholder="Google Authenticator kodu" required><button class="admin-btn primary">Giriş Yap</button><div id="err" class="admin-muted"></div></form><div class="admin-login-note">Bu giriş Owner hesabından ayrıdır. Admin ekip hesabı için ayrı e-posta, şifre ve 2FA kullanılır.</div></div></div><script>
const form=document.getElementById('f'),errorBox=document.getElementById('err'),codeInput=document.getElementById('code');codeInput.required=false;codeInput.placeholder='2FA açıksa doğrulama kodu';
form.onsubmit=async event=>{
  event.preventDefault();errorBox.textContent='Yönetici oturumu doğrulanıyor…';
  try{const result=await adminLogin(document.getElementById('email').value,document.getElementById('password').value,document.getElementById('code').value);if(result.admin?.role!=='team_admin')throw new Error('team_role_required');if(window.SafeAdmin?.setSessionProfile)SafeAdmin.setSessionProfile({id:result.admin.id,email:result.admin.email,role:'Team Admin',name:'Admin Ekibi'});localStorage.setItem('safepays_portal','admin');location.replace('/admin/team-dashboard.html');}
  catch(error){errorBox.textContent=error.message==='invalid_2fa_code'?'2FA kodu hatalı.':error.message==='invalid_team_credentials'?'E-posta veya şifre hatalı.':error.message==='team_login_not_configured'?'Admin ekip hesabı için Owner’dan ayrı giriş bilgileri henüz ayarlanmamış.':error.message==='team_credentials_not_separate'?'Admin ekip bilgileri Owner bilgilerinden farklı olmalı.':error.message==='team_role_required'?'Bu giriş Admin ekip hesabı değil. Owner paneli için ayrı giriş sayfasını kullanın.':error.message||'Admin ekip girişi başarısız.';}
};
</script></body></html>
