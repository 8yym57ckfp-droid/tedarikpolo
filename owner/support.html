<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Safepays Owner — Destek Talepleri</title>
  <link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../admin/admin.css">
  <script src="../admin/admin.js"></script><script src="../admin/admin-api.js"></script><script src="../assets/app.js"></script><script src="../admin/admin-store.js"></script>
  <style>
    .support-layout{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:16px}.ticket-list,.ticket-thread{background:#fff;border:1px solid #e4eaf1;border-radius:16px;padding:16px;min-height:420px}.ticket-item{display:block;width:100%;text-align:left;border:1px solid #e5eaf1;background:#fff;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.ticket-item.active{border-color:#168cff;background:#f4f9ff}.ticket-item strong,.ticket-item small{display:block}.ticket-item small,.thread-meta{color:#718096;margin-top:5px}.thread-messages{height:330px;overflow:auto;padding:8px 0}.thread-message{max-width:85%;padding:10px 12px;border-radius:12px;background:#f1f5f9;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.thread-message.admin{margin-left:auto;background:#e8f3ff}.reply-box{display:flex;gap:8px}.reply-box textarea{flex:1;min-height:72px;border:1px solid #dbe3ed;border-radius:10px;padding:10px;font:inherit}.empty{color:#718096;padding:25px;text-align:center}@media(max-width:850px){.support-layout{grid-template-columns:1fr}}
  </style>
<link rel="stylesheet" href="../assets/owner.css"><script src="owner.js"></script></head>
<body class="admin-body">
  <div class="admin-layout"><aside class="admin-side"><a class="logo" href="dashboard.html">Safe<span>Pays</span></a><nav class="admin-nav"><a href="dashboard.html">Genel Bakış</a><a href="requests.html">Bekleyen İşlemler</a><a href="wallet-addresses.html">Cüzdan Hesapları</a><a class="active" href="support.html">Destek Talepleri</a><a href="audit.html">Audit Logları</a><a href="../index.html">Siteye Dön</a></nav></aside>
    <main class="admin-main"><div class="admin-head"><div><div class="admin-muted">MEMBER SUPPORT</div><h1>Destek Talepleri</h1><div class="admin-muted">Üyelerin mesajları ve yanıtlar veritabanında saklanır.</div></div><button class="admin-btn" onclick="loadTickets()">Yenile</button></div>
      <div class="support-layout"><section class="ticket-list"><h3>Gelen talepler</h3><div id="ticketList"><div class="empty">Yükleniyor…</div></div></section><section class="ticket-thread"><h3 id="threadTitle">Bir talep seçin</h3><div class="thread-meta" id="threadMeta"></div><div class="thread-messages" id="threadMessages"><div class="empty">Mesajlar burada görüntülenir.</div></div><div class="reply-box"><textarea id="replyText" placeholder="Üyeye yanıt yazın"></textarea><button class="admin-btn" onclick="sendReply()">Yanıtla</button></div><div id="supportMessage" class="admin-muted" style="margin-top:8px"></div></section></div>
    </main>
  </div><script src="../admin/support-admin.js"></script>
