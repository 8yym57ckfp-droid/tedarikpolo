<!doctype html><html lang="tr"><head><script>(function(){try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafePays Owner — Üye Operasyonları</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../assets/owner.css"><link rel="stylesheet" href="../admin/admin.css"><script src="owner.js"></script><script src="../admin/admin-store.js"></script><script src="../admin/admin-api.js"></script><link rel="stylesheet" href="../assets/dark-theme.css"><style>.member-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.member-table-wrap{overflow:auto}.member-table{width:100%;min-width:900px;border-collapse:collapse}.member-table th,.member-table td{padding:11px 9px;border-bottom:1px solid #1b3552;text-align:left;font-size:11px}.member-table th{font-size:9px;color:#7890aa;text-transform:uppercase}.search-row{display:flex;gap:8px;flex-wrap:wrap}.search-row input{flex:1;min-width:240px}.error-box{padding:12px;border:1px solid #74323d;background:#2a1015;color:#ffb4ba;border-radius:10px;margin-top:10px}.loading{text-align:center;color:#7890aa;padding:28px}.empty{text-align:center;color:#7890aa;padding:28px}.member-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;padding:9px 0 2px}.member-filter{border:1px solid #43205f;background:#12071d;color:#c9b7d9;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:800;cursor:pointer}.member-filter span{display:inline-flex;min-width:18px;height:18px;align-items:center;justify-content:center;margin-left:4px;border-radius:999px;background:#241136;color:#a98bc0}.member-filter:hover{border-color:#8d35db;color:#fff}.member-filter.active{border-color:#a43cff;background:#2b1048;color:#fff;box-shadow:0 0 0 1px rgba(164,60,255,.18)}.member-filter.active span{background:#8d35db;color:#fff}.status-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.status-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;white-space:nowrap;border:1px solid #2f765e;background:rgba(53,224,160,.08);color:#65eabb}.status-badge.lock{border-color:#793341;background:rgba(255,102,123,.09);color:#ff9aa4}.status-badge.freeze{border-color:#6d4b99;background:rgba(164,60,255,.1);color:#c994ff}.status-badge.suspend{border-color:#8a5a25;background:rgba(255,177,66,.1);color:#ffc46b}@media(max-width:700px){.member-stats{grid-template-columns:repeat(2,1fr)}.member-filters{display:grid;grid-template-columns:1fr 1fr}.member-filter{width:100%;text-align:left}}
</style><style>.member-stats .admin-value{color:#f1f6ff!important;text-shadow:0 1px 8px rgba(70,150,255,.16)}.member-stats .card{background:linear-gradient(145deg,rgba(16,38,65,.96),rgba(11,24,43,.98));border-color:#244462}.member-stats .admin-muted{color:#a9bfd6!important}</style></head><body class="admin-body"><div class="admin-layout"><aside class="admin-side"><a class="logo" href="dashboard.html">Safe<span>Pays</span></a><nav class="admin-nav"></nav></aside><main class="admin-main"><div class="admin-head"><div><div class="admin-muted">OWNER · MEMBER OPERATIONS</div><h1>Üye Operasyonları</h1><div class="admin-muted">Üyeleri, bakiyelerini ve finansal hareketlerini Owner seviyesinde yönetin.</div></div></div><div class="member-stats"><div class="card"><div class="admin-muted">Toplam Üye</div><div class="admin-value" id="totalUsers">—</div></div><div class="card"><div class="admin-muted">Toplam Bakiye</div><div class="admin-value" id="totalBalance">—</div></div><div class="card"><div class="admin-muted">Toplam Yatırım</div><div class="admin-value" id="totalDeposit">—</div></div><div class="card"><div class="admin-muted">Toplam Çekim</div><div class="admin-value" id="totalWithdraw">—</div></div></div><div class="admin-card" style="margin-top:14px"><div class="search-row"><input id="search" placeholder="İsim, e-posta, telefon, ID veya referans kodu ara..."><button class="admin-btn" onclick="loadMembers()">Ara</button></div><div class="member-filters" id="memberFilters"><button class="member-filter active" data-filter="all">Tümü <span id="countAll">0</span></button><button class="member-filter" data-filter="active">Aktif <span id="countActive">0</span></button><button class="member-filter" data-filter="deposit">🔒 Yatırım Kilitli <span id="countDeposit">0</span></button><button class="member-filter" data-filter="withdrawal">🔒 Çekim Kilitli <span id="countWithdrawal">0</span></button><button class="member-filter" data-filter="action">🔒 İşlem Kilitli <span id="countAction">0</span></button><button class="member-filter" data-filter="suspended">⏸ Askıda <span id="countSuspended">0</span></button><button class="member-filter" data-filter="locked">🔒 Hesap Kilitli <span id="countLocked">0</span></button></div><div id="error"></div><div class="member-table-wrap" style="margin-top:12px"><table class="member-table"><thead><tr><th>Üye</th><th>E-posta</th><th>Telefon</th><th>Bakiye</th><th>Yatırım</th><th>Çekim</th><th>Referans</th><th>Durum</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="9" class="loading">Üyeler yükleniyor...</td></tr></tbody></table></div></div></main></div><script>
let members=[], currentFilter='all';
const fmt=n=>Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT';
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function securityLocal(){try{return JSON.parse(localStorage.getItem('safepays_owner_security_v1')||'{}')}catch(e){return {}}}
function normalizeSecurity(u){const all=securityLocal();const m=all[String(u.id)]||{};const status=String(u.securityStatus||u.accountStatus||m.accountStatus||'active').toLowerCase();return {...u,securityStatus:status,withdrawalFrozen:Boolean(u.withdrawalFrozen??m.withdrawalFrozen),depositFrozen:Boolean(u.depositFrozen??m.depositFrozen)}}
function securityFlags(u){u=normalizeSecurity(u);return {locked:u.securityStatus==='locked',suspended:u.securityStatus==='suspended',deposit:!!u.depositFrozen,withdrawal:!!u.withdrawalFrozen,action:!!u.depositFrozen||!!u.withdrawalFrozen}}
function matchesFilter(u){const f=securityFlags(u);if(currentFilter==='all')return true;if(currentFilter==='active')return !f.locked&&!f.suspended&&!f.deposit&&!f.withdrawal;if(currentFilter==='deposit')return f.deposit;if(currentFilter==='withdrawal')return f.withdrawal;if(currentFilter==='action')return f.action;if(currentFilter==='suspended')return f.suspended;if(currentFilter==='locked')return f.locked;return true}
function statusHtml(u){const f=securityFlags(u), b=[];if(f.locked)b.push('<span class="status-badge lock">🔒 Hesap Kilitli</span>');else if(f.suspended)b.push('<span class="status-badge suspend">⏸ Askıda</span>');if(f.deposit)b.push('<span class="status-badge freeze">🔒 Yatırım Kilitli</span>');if(f.withdrawal)b.push('<span class="status-badge freeze">🔒 Çekim Kilitli</span>');if(!b.length)b.push('<span class="status-badge">Aktif</span>');return '<div class="status-wrap">'+b.join('')+'</div>'}
function updateCounts(){const c={all:members.length,active:0,deposit:0,withdrawal:0,action:0,suspended:0,locked:0};members.forEach(u=>{const f=securityFlags(u);if(!f.locked&&!f.suspended&&!f.deposit&&!f.withdrawal)c.active++;if(f.deposit)c.deposit++;if(f.withdrawal)c.withdrawal++;if(f.action)c.action++;if(f.suspended)c.suspended++;if(f.locked)c.locked++});Object.entries(c).forEach(([k,v])=>{const el=document.getElementById('count'+({all:'All',active:'Active',deposit:'Deposit',withdrawal:'Withdrawal',action:'Action',suspended:'Suspended',locked:'Locked'}[k]));if(el)el.textContent=v})}
async function ensureBackendAdmin(){try{await adminFetch('/me');return true}catch(e){return false}}
function renderMembers(){const filtered=members.filter(matchesFilter);updateCounts();rows.innerHTML=filtered.length?filtered.map(u=>`<tr><td><b>${esc((u.firstName||'')+' '+(u.lastName||''))}</b><div class="admin-muted">${esc(u.id)}</div></td><td>${esc(u.email||'—')}</td><td>${esc(u.phone||'—')}</td><td>${fmt(u.balance)}</td><td>${fmt(u.totalDeposits)}</td><td>${fmt(u.totalWithdrawals)}</td><td>${esc(u.referralCode||'—')}</td><td>${statusHtml(u)}</td><td><a class="admin-btn" href="user-detail.html?id=${encodeURIComponent(u.id)}">Detay</a></td></tr>`).join(''):'<tr><td colspan="9" class="empty">Bu filtreye uygun üye bulunamadı.</td></tr>'}
async function loadMembers(){error.innerHTML='';rows.innerHTML='<tr><td colspan="9" class="loading">Üyeler yükleniyor...</td></tr>';try{const q=encodeURIComponent(search.value.trim());if(await ensureBackendAdmin()){const d=await adminFetch('/user-center?q='+q);members=(d.users||[]).map(normalizeSecurity);totalUsers.textContent=d.totalUsers??members.length;totalBalance.textContent=fmt(members.reduce((a,x)=>a+Number(x.balance||0),0));totalDeposit.textContent=fmt(members.reduce((a,x)=>a+Number(x.totalDeposits||0),0));totalWithdraw.textContent=fmt(members.reduce((a,x)=>a+Number(x.totalWithdrawals||0),0));}else{const qv=decodeURIComponent(q).toLowerCase();members=localMembers().filter(u=>!qv||[u.id,u.firstName,u.lastName,u.email,u.phone,u.referralCode].join(' ').toLowerCase().includes(qv)).map(normalizeSecurity);totalUsers.textContent=members.length;totalBalance.textContent=fmt(members.reduce((a,x)=>a+Number(x.balance||0),0));totalDeposit.textContent=fmt(members.reduce((a,x)=>a+Number(x.totalDeposits||0),0));totalWithdraw.textContent=fmt(members.reduce((a,x)=>a+Number(x.totalWithdrawals||0),0));error.innerHTML='<div class="error-box">Backend bağlantısı yok; cihazdaki kayıtlar gösteriliyor.</div>';}renderMembers()}catch(e){rows.innerHTML='<tr><td colspan="9" class="empty">Üyeler yüklenemedi.</td></tr>';error.innerHTML='<div class="error-box">'+esc(e.message)+'</div>'}}
function localMembers(){const out=[];for(const key of ['safepays_demo_registered_users_v113','safepays_demo_registered_users_v112','safepays_demo_registered_users_v111','safepays_demo_registered_users_v110','safepays_demo_registered_users_v109']){try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))out.push(...a)}catch(e){}}const seen=new Set();return out.filter(u=>{const k=String(u.id||u.email);if(seen.has(k))return false;seen.add(k);return true}).map(u=>({...u,totalDeposits:0,totalWithdrawals:0,kycStatus:u.kycStatus||'Aktif'}))}
search.addEventListener('keydown',e=>{if(e.key==='Enter')loadMembers()});document.querySelectorAll('.member-filter').forEach(btn=>btn.addEventListener('click',()=>{currentFilter=btn.dataset.filter;document.querySelectorAll('.member-filter').forEach(x=>x.classList.toggle('active',x===btn));renderMembers()}));loadMembers();
</script></body></html>
