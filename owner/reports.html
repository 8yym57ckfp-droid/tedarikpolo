<!doctype html><html lang="tr"><head><script>try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafePays Owner — Raporlar</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../admin/admin.css"><link rel="stylesheet" href="../assets/owner.css"><script src="../admin/admin-store.js"></script><script ></script><script src="../assets/demo-store.js"></script><link rel="stylesheet" href="../assets/dark-theme.css"><script src="owner.js"></script></head><body class="admin-body owner-page"><div class="admin-layout"><aside class="admin-side"><a class="logo" href="dashboard.html">Safe<span>Pays</span></a><nav class="admin-nav"></nav></aside><main class="admin-main"><div class="admin-head"><div><div class="admin-muted">ANALYTICS</div><h1>Raporlar</h1><div class="admin-muted">Finansal hareketleri ve işlem sayılarını özetle.</div></div></div><div class="admin-card"><div style="display:flex;gap:10px;flex-wrap:wrap"><select id="range"><option value="7">Son 7 gün</option><option value="30">Son 30 gün</option><option value="90">Son 90 gün</option></select></div><div class="admin-grid" style="margin-top:15px"><div class="card"><div class="admin-muted">Yatırım hacmi</div><div class="admin-value" id="dep">—</div></div><div class="card"><div class="admin-muted">Çekim hacmi</div><div class="admin-value" id="wd">—</div></div><div class="card"><div class="admin-muted">İşlem adedi</div><div class="admin-value" id="cnt">—</div></div><div class="card"><div class="admin-muted">Bekleyen</div><div class="admin-value" id="pend">—</div></div></div></div></main></div><script>function run(){const days=Number(range.value),cut=Date.now()-days*86400000,a=SafepaysDemo.read().filter(x=>new Date(x.
