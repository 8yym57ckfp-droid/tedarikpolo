<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safepays Owner — Üye Merkezi</title><link rel="stylesheet" href="../assets/styles.css"><link rel="stylesheet" href="../admin/admin.css"><link rel="stylesheet" href="../assets/dark-theme.css"><link rel="stylesheet" href="../assets/owner.css"><script src="../admin/admin-store.js"></script><script src="../admin/admin-api.js"></script><script src="owner.js"></script>
<style>
.member-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.member-stat{background:#0b1422;border:1px solid #1b3552;border-radius:14px;padding:14px}.member-stat small{display:block;color:#7890aa;font-size:10px;font-weight:800}.member-stat strong{display:block;margin-top:7px;font-size:21px}.member-toolbar{display:flex;gap:9px;margin-bottom:13px}.member-toolbar input{flex:1;min-width:0}.member-list{display:grid;gap:10px}.member-row{border:1px solid #1b3552;background:#0d1b2c;border-radius:14px;padding:13px}.member-main{display:grid;grid-template-columns:1.35fr 1fr .85fr .9fr auto;gap:12px;align-items:center}.member-name{font-weight:900}.member-sub{font-size:10px;color:#7890aa;margin-top:4px;word-break:break-word}.member-label{display:block;color:#607995;font-size:9px;text-transform:uppercase;font-weight:900;margin-bottom:4px}.member-actions{display:flex;gap:6px}.member-btn{border:1px solid #295276;background:#102943;color:#edf5ff;border-radius:8px;padding:8px 10px;font-weight:800;cursor:pointer}.member-btn.primary{background:linear-gradient(90deg,#1685ff,#6354ef);border-color:#2c8cff}.member-detail{display:none;border-top:1px solid #1b3552;margin-top:12px;padding-top:12px}.member-detail.open{display:block}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.detail-box{background:#091625;border:1px solid #1b3552;border-radius:10px;padding:10px}.detail-box small{display:block;color:#7890aa;font-size:9px;margin-bottom:4px}.tx-wrap{overflow:auto;border:1px solid #1b3552;border-radius:10px}.tx-table{width:100%;min-width:700px;border-collapse:collapse}.tx-table th,.tx-table td{padding:8px;border-bottom:1px solid #18304a;text-align:left;font-size:10px}.tx-table th{color:#7890aa}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-weight:900;font-size:9px}.ok{background:#0b4d3c;color:#62efbb}.wait{background:#554313;color:#ffdb6b}.bad{background:#54202a;color:#ff9ba4}.empty{padding:24px;text-align:center;color:#7890aa}.error{color:#ff8d99;font-size:11px}.source-note{margin-top:8px;color:#5f7894;font-size:9px}
@media(max-width:900px){.member-stats{grid-template-columns:1fr 1fr}.member-main{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.member-main{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.member-toolbar{flex-direction:column}.member-toolbar button{width:100%}}
</style></head><body class="admin-body"><div class="admin-layout"><aside class="admin-side"><a class="logo" href="dashboard.html">Safe<span>Pays</span></a><nav class="admin-nav"></nav></aside><main class="admin-main"><div class="admin-head"><div><div class="admin-muted">OWNER · MEMBER CENTER</div><h1>Üye Merkezi</h1><div class="admin-muted">Tüm üyelerin hesap, iletişim, referans, bakiye ve son işlemlerini yönetin.</div></div></div>
<div class="member-stats"><div class="member-stat"><small>Toplam Üye</small><strong id="statUsers">—</strong></div><div class="member-stat"><small>Toplam Bakiye</small><strong id="statBalance">—</strong></div><div class="member-stat"><small>Toplam Yatırım</small><strong id="statDeposits">—</strong></div><div class="member-stat"><small>Toplam Çekim</small><strong id="statWithdrawals">—</strong></div></div>
<div class="admin-card"><div class="member-toolbar"><input id="search" placeholder="Ad, e-posta, telefon, ID veya referans kodu ara..."><button class="member-btn primary" id="refresh">Yenile</button></div><div id="msg" class="source-note"></div><div id="members" class="member-list"><div class="empty">Üyeler yükleniyor…</div></div></div>
</main></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=n=>Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' USDT',date=v=>v?new Date(v).toLocaleString('tr-TR'):'—';
let users=[],txs=[],source='';
function localUsers(){
 let list=[];try{list=JSON.parse(localStorage.getItem('safepays_demo_registered_users_v113')||'[]')}catch(e){}
 let profiles={};try{profiles=JSON.parse(localStorage.getItem('safepays_demo_profiles_v38')||'{}')}catch(e){}
 // Include the built-in demo account and every locally registered account.
 const base={id:'demo-user',firstName:'Veysi',lastName:'Duman',email:'test@safepays.local',phone:'+90 5•• ••• •• 21',balance:Number(localStorage.getItem('safepays_demo_balance_v37_demo-user')||5000),referralCode:'SAFE-VYSI82',referralEarnings:186.4,createdAt:'2026-06-12T14:28:17+03:00'};
 const map=new Map([[base.id,base]]);
 list.forEach(u=>{const p=profiles[u.id]||{};let bal=u.balance;try{const b=localStorage.getItem('safepays_demo_balance_v37_'+u.id);if(b!==null)bal=Number(b)}catch(e){}map.set(u.id,{...u,...p,balance:Number(bal||0),referralCode:u.referralCode||p.referralCode||'—',referralEarnings:Number(u.referralEarnings??p.referralEarnings??0)})});
 try{const current=JSON.parse(localStorage.getItem('safepays_demo_current_user')||'null');if(current&&current.id&&!map.has(current.id))map.set(current.id,{...current,balance:Number(current.balance||0),referralCode:current.referralCode||'—',referralEarnings:Number(current.referralEarnings||0)})}catch(e){}
 return [...map.values()];
}
function localTxs(){
 const out=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith('safepays_demo_transactions_v37_'))continue;try{const a=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(a))out.push(...a)}catch(e){}}
 return out;
}
function status(s){return s==='approved'?'<span class="pill ok">Onaylandı</span>':s==='pending'?'<span class="pill wait">Bekliyor</span>':s==='rejected'||s==='auto-rejected'?'<span class="pill bad">Reddedildi</span>':'<span class="pill">'+esc(s||'—')+'</span>'}
function type(t){return t==='deposit'?'Yatırım':t==='withdrawal'?'Çekim':t||'—'}
function render(list){$('members').innerHTML=list.length?list.map(u=>{const ut=txs.filter(t=>String(t.userId)===String(u.id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)),last=ut[0];return `<article class="member-row"><div class="member-main"><div><div class="member-name">${esc((u.firstName||'')+' '+(u.lastName||''))}</div><div class="member-sub">${esc(u.id)} · ${esc(u.email||'—')}</div></div><div><span class="member-label">Telefon</span>${esc(u.phone||'—')}<div class="member-sub">Kayıt: ${esc(date(u.createdAt))}</div></div><div><span class="member-label">Bakiye</span><b>${money(u.balance)}</b><div class="member-sub">Ref: ${esc(u.referralCode||'—')}</div></div><div><span class="member-label">Son işlem</span>${last?esc(type(last.type))+' · '+money(last.amount):'—'}<div class="member-sub">${last?esc(date(last.createdAt)):'İşlem yok'}</div></div><div class="member-actions"><button class="member-btn primary" onclick="toggleDetail('${esc(u.id)}',this)">Detay</button></div></div><div class="member-detail" id="detail-${esc(u.id)}"></div></article>`}).join(''):'<div class="empty">Üye bulunamadı.</div>'}
function filter(){const q=$('search').value.trim().toLowerCase();render(users.filter(u=>!q||[u.id,u.firstName,u.lastName,u.email,u.phone,u.referralCode,u.referredBy].filter(Boolean).join(' ').toLowerCase().includes(q)))}
function loadLocal(){users=localUsers();txs=localTxs();source='Yerel demo kayıtları';updateStats();filter();$('msg').textContent=source+' kullanılıyor.'}
function updateStats(){ $('statUsers').textContent=users.length.toLocaleString('tr-TR');$('statBalance').textContent=money(users.reduce((a,u)=>a+Number(u.balance||0),0));$('statDeposits').textContent=money(txs.filter(t=>t.type==='deposit'&&t.status==='approved').reduce((a,t)=>a+Number(t.amount||0),0));$('statWithdrawals').textContent=money(txs.filter(t=>t.type==='withdrawal'&&t.status==='approved').reduce((a,t)=>a+Number(t.amount||0),0)); }
async function load(){
 // Local-first makes the static Netlify/demo deployment show registrations immediately.
 loadLocal();
 try{const [ud,td]=await Promise.all([adminFetch('/users'),adminFetch('/transactions')]);const apiUsers=ud.users||[];if(apiUsers.length){users=apiUsers;txs=td.transactions||[];source='Backend kayıtları';updateStats();filter();$('msg').textContent=source+' kullanılıyor.'}}catch(e){/* local data is authoritative for static demo mode */}
}
async function toggleDetail(id,btn){const box=$('detail-'+id);if(box.classList.contains('open')){box.classList.remove('open');btn.textContent='Detay';return}box.classList.add('open');btn.textContent='Kapat';const u=users.find(x=>String(x.id)===String(id))||{};const tx=txs.filter(t=>String(t.userId)===String(id)).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));const deps=tx.filter(t=>t.type==='deposit'&&t.status==='approved').reduce((a,t)=>a+Number(t.amount||0),0),wds=tx.filter(t=>t.type==='withdrawal'&&t.status==='approved').reduce((a,t)=>a+Number(t.amount||0),0),pending=tx.filter(t=>t.status==='pending').reduce((a,t)=>a+Number(t.amount||0),0);box.innerHTML=`<div class="detail-grid"><div class="detail-box"><small>E-posta</small><b>${esc(u.email||'—')}</b><div class="member-sub">${u.emailVerified?'Doğrulandı':'Doğrulanmadı'}</div></div><div class="detail-box"><small>Telefon</small><b>${esc(u.phone||'—')}</b><div class="member-sub">${u.phoneVerified?'Doğrulandı':'Doğrulanmadı'}</div></div><div class="detail-box"><small>Referans Kodu</small><b>${esc(u.referralCode||'—')}</b><div class="member-sub">Davet eden: ${esc(u.referredBy||'—')}</div></div><div class="detail-box"><small>Referans Kazancı</small><b>${money(u.referralEarnings)}</b></div><div class="detail-box"><small>Bakiye</small><b>${money(u.balance)}</b></div><div class="detail-box"><small>Onaylı Yatırım</small><b>${money(deps)}</b></div><div class="detail-box"><small>Onaylı Çekim</small><b>${money(wds)}</b></div><div class="detail-box"><small>Bekleyen Tutar</small><b>${money(pending)}</b></div></div><div class="tx-wrap"><table class="tx-table"><thead><tr><th>İşlem</th><th>Tutar</th><th>Ağ</th><th>Durum</th><th>Tarih</th><th>TX Hash</th></tr></thead><tbody>${tx.slice(0,12).map(t=>`<tr><td>${esc(type(t.type))}<div class="member-sub">${esc(t.id)}</div></td><td>${money(t.amount)}</td><td>${esc(t.network||'—')}</td><td>${status(t.status)}</td><td>${esc(date(t.createdAt))}</td><td>${esc(t.txHash||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Bu üyeye ait işlem bulunmuyor.</td></tr>'}</tbody></table></div>`}
$('search').addEventListener('input',filter);$('refresh').addEventListener('click',load);load();
</script></body></html>
