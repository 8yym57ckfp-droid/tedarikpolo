<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafePays — Bildirimler</title><link rel="stylesheet" href="assets/styles.css"><style>body{background:#071426;color:#edf5ff}.wrap{max-width:860px;margin:6vh auto;padding:24px}.card{background:#10233a;border:1px solid #24405d;border-radius:18px;padding:20px;margin:12px 0}.muted{color:#9bb0c8}.item{padding:14px 0;border-bottom:1px solid #29415b}.item:last-child{border-bottom:0}.item small{display:block;color:#9bb0c8;margin-top:6px}</style><link rel="stylesheet" href="assets/member-premium.css?v=15"></head><body><main class="wrap"><p class="muted">HESAP</p><h1>Hesap hareketleri</h1><p class="muted">Bu liste işlem ve destek kayıtlarınızdan oluşturulur.</p><section class="card" id="list">Yükleniyor…</section><p><a href="dashboard.html">Panele dön</a></p></main><script>(async()=>{const token=localStorage.getItem('safepays_api_token')||'';if(!token){location.href='login.html';return}try{const h={Authorization:'Bearer '+token};const [tr,sr]=await Promise.all([fetch('/api/transactions',{headers:h}),fetch('/api/support/tickets',{headers:h})]);if(!tr.ok||!sr.ok)throw Error();const tx=(await tr.json()).transactions||[],tickets=(await sr.json()).tickets||[];const items=[...tx.map(x=>({at:x.decisionAt||x.createdAt,title:(x.type==='deposit'?'Yatırım':'Çekim')+' talebi · '+({pending:'İncelemede',approved:'Onaylandı',rejected:'Reddedildi','auto-rejected':'Süre doldu'}[x.status]||x.status),detail:x.id+' · '+Number(x.amount||0).toLocaleString('tr-TR')+' USDT · '+(x.network||'')})),...tickets.flatMap(t=>(t.messages||[]).filter(m=>m.senderRole==='admin').map(m=>({at:m.createdAt,title:'Destek yanıtı · '+t.subject,detail:m.message})))].sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,50);const list=document.getElementById('list');list.innerHTML=items.length?items.map(x=>'<article class="item"><b>'+String(x.title).replace(/[&<>"']/g,'')+'</b><small>'+String(x.detail||'').replace(/[&<>"']/g,'')+' · '+new Date(x.at).toLocaleString('tr-TR')+'</small></article>').join(''):'Henüz işlem veya destek yanıtı bulunmuyor.'}catch(e){document.getElementById('list').textContent='Hesap hareketleri alınamadı.'}})();</script><script src="assets/member-premium.js?v=12" defer></script></body></html>
