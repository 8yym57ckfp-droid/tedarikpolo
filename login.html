<!doctype html>
<html lang="tr">
<head>
<script>(function(){try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safepays — Hesabınıza Giriş Yapın</title>
<meta name="theme-color" content="#02060e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="assets/app.js"></script>
<script src="assets/demo-store.js"></script>
<script src="assets/i18n.js"></script>

</head>
<body class="auth-public">
<div class="pl-ambient-bg" aria-hidden="true">
  <span class="pl-ambient-orb pl-ambient-orb-a"></span>
  <span class="pl-ambient-orb pl-ambient-orb-b"></span>
  <span class="pl-ambient-orb pl-ambient-orb-c"></span>
  <span class="pl-ambient-stars pl-ambient-stars-a"></span>
  <span class="pl-ambient-stars pl-ambient-stars-b"></span>
</div>
<div class="auth-page">
  <section class="auth-wrap">
    <div class="auth">
      <a class="logo public-logo auth-logo" href="index.html">
        <img src="assets/safepays-mark.png" alt="Safe Pays">
        <span class="logo-words"><b>Safe</b><b>Pays</b></span>
      </a>
      <h1>Hesabınıza Giriş Yapın</h1>
      <p>Dünya çapında güvenli ve hızlı işlemler için hemen giriş yapın.</p>
      <div class="social">
        <button type="button" class="oauth-pill oauth-google" onclick="toast('Google giriş demo')">
          <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          <span>Google ile devam et</span>
        </button>
        <button type="button" class="oauth-pill oauth-apple" onclick="toast('Apple giriş demo')">
          <svg class="oauth-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#000" d="M16.365 1.43c0 1.14-.465 2.21-1.247 3.01-.81.83-2.17 1.47-3.32 1.38-.14-1.1.4-2.25 1.17-3.04.81-.84 2.22-1.45 3.4-1.35zM20.82 17.37c-.53 1.22-.78 1.76-1.46 2.84-.95 1.5-2.29 3.37-3.95 3.39-1.47.02-1.85-.96-3.85-.95-2 0-2.42.96-3.89.97-1.66.02-2.93-1.7-3.88-3.19C1.67 17.5.4 12.9 2.48 9.74c1.03-1.57 2.66-2.56 4.25-2.56 1.58 0 2.57.97 3.88.97 1.27 0 2.05-.98 3.87-.98 1.38 0 2.84.75 3.87 2.05-3.4 1.86-2.85 6.72.47 8.15z"/>
          </svg>
          <span>Apple ile devam et</span>
        </button>
      </div>
      <div class="auth-divider" role="separator"><span>veya</span></div>
      <form onsubmit="return testLogin(event)">
        <div class="field">
          <label for="loginEmail">E-posta veya Telefon</label>
          <input id="loginEmail" required value="test@safepays.local" placeholder="E-posta veya +90 telefon numarası" autocomplete="username">
        </div>
        <div class="field">
          <label for="loginPassword">Şifre</label>
          <input id="loginPassword" type="password" required value="12345678" placeholder="Şifrenizi girin" autocomplete="current-password">
        </div>
        <div class="auth-row">
          <label class="hint auth-remember"><input type="checkbox"> Beni hatırla</label>
          <a class="hint auth-forgot" href="#" onclick="openForgotPassword(event)">Şifremi Unuttum</a>
        </div>
        <button class="btn full auth-submit">Giriş Yap</button>
      </form>
      <p class="center auth-switch">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
    </div>
  </section>
</div>
<script>
async function testLogin(e){
  e.preventDefault();
  const raw=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const normalizePhone=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('90'))d=d.slice(2);if(d.startsWith('0'))d=d.slice(1);return d.length===10&&d.startsWith('5')?'+90'+d:null};
  const phone=normalizePhone(raw);

  // Önce backend oturumunu dene. Böylece API ile oluşturulmuş yeni hesaplar
  // çıkış yaptıktan sonra tekrar aynı hesapla giriş yapabilir.
  try{
    const body={password};
    if(phone) body.phone=phone; else body.email=raw.toLowerCase();
    const r=await fetch(new URL('/api/auth/login',window.location.origin).toString(),{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
    });
    const text=await r.text(); let d={}; try{d=JSON.parse(text)}catch(err){}
    if(r.ok && d.token && d.user){
      localStorage.setItem('safepays_api_token',d.token);
      localStorage.setItem('safepays_demo_auth','1');
      // SECURITY FIX: never store the plaintext password in localStorage — it was previously spread into
      // the cached user object here ({...d.user,password}), readable by any script/extension on the page.
      localStorage.setItem('safepays_demo_current_user',JSON.stringify(d.user));
      localStorage.setItem('safepays_demo_login_identifier', raw.toLowerCase());
      location.href='dashboard.html'; return false;
    }
  }catch(err){}

  // Statik Netlify/demo fallback. Eski demo kayıt anahtarları da korunur.
  const demoPassword=localStorage.getItem('safepays_demo_reset_password')||'12345678';
  if(raw.toLowerCase()==='test@safepays.local'&&password===demoPassword){
    const demo={id:'84290482',username:'karga',firstName:'Veysi',lastName:'Duman',email:'test@safepays.local',phone:null,balance:12480};
    localStorage.setItem('safepays_demo_auth','1');
    localStorage.setItem('safepays_api_token','demo-token');
    localStorage.setItem('safepays_demo_current_user',JSON.stringify(demo));
    localStorage.setItem('safepays_demo_login_identifier', raw.toLowerCase());
    location.href='dashboard.html';return false;
  }
  let users=[];
  for(const key of ['safepays_demo_registered_users_v113','safepays_demo_registered_users_v112','safepays_demo_registered_users_v111','safepays_demo_registered_users_v110','safepays_demo_registered_users_v109']){
    try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))users=users.concat(a)}catch(err){}
  }
  const user=users.find(u=>{
    const emailMatch=String(u.email||'').toLowerCase()===raw.toLowerCase();
    const phoneMatch=phone && String(u.phone||'')===phone;
    return (emailMatch||phoneMatch)&&String(u.password||'')===password;
  });
  if(user){
    localStorage.setItem('safepays_demo_auth','1');
    localStorage.setItem('safepays_api_token','demo-'+user.id);
    localStorage.setItem('safepays_demo_current_user',JSON.stringify(user));
    localStorage.setItem('safepays_demo_login_identifier', raw.toLowerCase());
    location.href='dashboard.html';return false;
  }
  showErrorModal('Giriş bilgileri hatalı','E-posta veya telefon numaranız ile şifrenizi kontrol edin. Bilgileriniz doğruysa tekrar deneyin.');
  return false;
}
</script>

<style>
.sp-forgot-backdrop{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.sp-forgot-backdrop.open{display:flex}
.sp-forgot-modal{width:min(100%,460px);background:#0a1c31;border:1px solid #1d456d;border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.55);padding:28px;color:#fff;position:relative}
.sp-forgot-close{position:absolute;right:16px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid #294d70;background:#102945;color:#a9bfd5;font-size:25px;cursor:pointer}
.sp-forgot-kicker{font-size:11px;letter-spacing:4px;color:#35a7ff;font-weight:800;margin-top:8px}
.sp-forgot-modal h3{font-size:25px;margin:10px 0 8px}.sp-forgot-modal p{color:#9fb4ca;line-height:1.55;margin:0 0 18px}
.sp-forgot-modal label{display:block;color:#d9e6f2;font-size:13px;font-weight:700;margin-bottom:7px}.sp-forgot-modal input{width:100%;box-sizing:border-box;border:1px solid #294b6d;background:#07182b;color:#fff;border-radius:12px;padding:14px;font-size:15px;outline:none}.sp-forgot-modal input:focus{border-color:#2997ff;box-shadow:0 0 0 3px rgba(41,151,255,.13)}
.sp-forgot-error{min-height:20px;color:#ff7181;font-size:12px;font-weight:700;margin:8px 0}.sp-forgot-actions{display:flex;gap:10px;margin-top:12px}.sp-forgot-actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;cursor:pointer}.sp-forgot-primary{background:linear-gradient(135deg,#168cff,#5a50ee);color:#fff}.sp-forgot-secondary{background:#102945;color:#c5d7e8;border:1px solid #294b6d!important}
.sp-forgot-demo{font-size:11px!important;color:#7f9ab4!important;margin-top:10px!important}
</style>
<div id="spForgotBackdrop" class="sp-forgot-backdrop" aria-hidden="true">
  <div class="sp-forgot-modal" role="dialog" aria-modal="true" aria-labelledby="spForgotTitle">
    <button class="sp-forgot-close" type="button" onclick="closeForgotPassword()" aria-label="Kapat">×</button>
    <div class="sp-forgot-kicker">SAFEPAYS</div>
    <h3 id="spForgotTitle">Şifreni sıfırla</h3>
    <p id="spForgotText">Kayıtlı e-posta adresini veya telefon numaranı gir.</p>
    <div id="spForgotBody"></div>
  </div>
</div>
<script>
function forgotUsers(){
  const out=[];
  for(const key of ['safepays_demo_registered_users_v113','safepays_demo_registered_users_v112','safepays_demo_registered_users_v111','safepays_demo_registered_users_v110','safepays_demo_registered_users_v109']){
    try{const a=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(a))out.push(...a)}catch(e){}
  }
  return out;
}
function openForgotPassword(e){
  e?.preventDefault();
  const b=document.getElementById('spForgotBackdrop');
  document.getElementById('spForgotTitle').textContent='Şifreni sıfırla';
  document.getElementById('spForgotText').textContent='Kayıtlı e-posta adresini gir. Güvenlik kodu e-posta adresine gönderilecek.';
  document.getElementById('spForgotBody').innerHTML=`<label for="forgotIdentifier">E-posta</label><input id="forgotIdentifier" autocomplete="email" inputmode="email" placeholder="ornek@mail.com"><div id="forgotError" class="sp-forgot-error"></div><div class="sp-forgot-actions"><button type="button" class="sp-forgot-secondary" onclick="closeForgotPassword()">Vazgeç</button><button type="button" class="sp-forgot-primary" onclick="forgotFindAccount()">Kodu Gönder</button></div>`;
  b.classList.add('open');b.setAttribute('aria-hidden','false');document.body.classList.add('sp-modal-open');setTimeout(()=>document.getElementById('forgotIdentifier')?.focus(),50);
}
function closeForgotPassword(){const b=document.getElementById('spForgotBackdrop');if(b){b.classList.remove('open');b.setAttribute('aria-hidden','true');document.body.classList.remove('sp-modal-open')}}
function forgotErrorMessage(code){
  const map={invalid_email:'Geçerli bir e-posta adresi girin.',email_send_failed:'E-posta gönderilemedi. Resend ayarlarını ve gönderici adresini kontrol edin.',invalid_code:'Güvenlik kodu hatalı.',code_expired:'Kodun süresi dolmuş veya artık geçerli değil.',too_many_attempts:'Çok fazla hatalı deneme yapıldı. Yeni kod isteyin.'};
  return map[code]||'İşlem sırasında bir sorun oluştu. Lütfen tekrar deneyin.';
}
async function forgotFindAccount(){
  const input=document.getElementById('forgotIdentifier');const err=document.getElementById('forgotError');
  const email=String(input?.value||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Geçerli bir e-posta adresi girin.';return}
  const users=forgotUsers();
  const demo=email==='test@safepays.local';
  const user=users.find(u=>String(u.email||'').toLowerCase()===email);
  if(!demo && !user){err.textContent='Bu bilgilerle kayıtlı bir hesap bulunamadı.';return}
  err.textContent='';
  try{
    const r=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'send',email})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){err.textContent=forgotErrorMessage(d.error);return}
  }catch(e){err.textContent='E-posta servisine ulaşılamadı. Lütfen tekrar deneyin.';return}
  sessionStorage.setItem('safepays_forgot_target',JSON.stringify({email}));
  document.getElementById('spForgotTitle').textContent='Güvenlik kodunu gir';
  document.getElementById('spForgotText').textContent='6 haneli kod e-posta adresinize gönderildi. Kod 10 dakika geçerlidir.';
  document.getElementById('spForgotBody').innerHTML=`<label for="forgotCode">Güvenlik kodu</label><input id="forgotCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 haneli kod"><label for="forgotNewPassword" style="margin-top:12px">Yeni şifre</label><input id="forgotNewPassword" type="password" minlength="8" autocomplete="new-password" placeholder="En az 8 karakter"><div id="forgotError" class="sp-forgot-error"></div><div class="sp-forgot-actions"><button type="button" class="sp-forgot-secondary" onclick="closeForgotPassword()">Vazgeç</button><button type="button" class="sp-forgot-primary" onclick="completeForgotPassword()">Şifreyi Güncelle</button></div>`;
  setTimeout(()=>document.getElementById('forgotCode')?.focus(),50);
}
async function completeForgotPassword(){
  const code=String(document.getElementById('forgotCode')?.value||'').trim();
  const pass=String(document.getElementById('forgotNewPassword')?.value||'');
  const err=document.getElementById('forgotError');
  if(!/^\d{6}$/.test(code)){err.textContent='6 haneli güvenlik kodunu girin.';return}
  if(pass.length<8){err.textContent='Yeni şifre en az 8 karakter olmalı.';return}
  let target={};try{target=JSON.parse(sessionStorage.getItem('safepays_forgot_target')||'{}')}catch(e){}
  if(!target.email){err.textContent='Sıfırlama oturumu bulunamadı. Yeni kod isteyin.';return}
  err.textContent='';
  try{
    // newPassword is sent together with the code so the server verifies + updates the real account
    // atomically. The client never mutates passwords itself (that was the old, broken localStorage-only flow).
    const r=await fetch('/api/password-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify',email:target.email,code,newPassword:pass})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){err.textContent=forgotErrorMessage(d.error);return}
    sessionStorage.removeItem('safepays_forgot_target');closeForgotPassword();showAppModal('Şifre güncellendi','Yeni şifreniz başarıyla oluşturuldu. Yeni şifrenizle giriş yapabilirsiniz.','info');
  }catch(e){err.textContent='Şifre sıfırlama servisine ulaşılamadı. Lütfen tekrar deneyin.';}
}
</script>
