<!doctype html><html lang="tr"><head><script>(function(){try{var p=location.pathname,s=p.includes('/admin/')?'admin':(p.includes('/owner/')?'owner':'member'),k='safepays-'+s+'-theme';if(localStorage.getItem(k)==='dark')document.documentElement.classList.add('dark-theme')}catch(e){}})();</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Safepays — Bakiye Hareketleri</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/activity.css"><script src="assets/app.js"></script><script src="assets/i18n.js"></script><link rel="stylesheet" href="assets/dark-theme.css"><script src="assets/maintenance.js"></script><link rel="stylesheet" href="assets/member-premium.css?v=8"></head><body><div class="app-shell"><main class="main-content" style="padding:24px"><div class="page-head"><div><div class="eyebrow">ACCOUNTING</div><h1>Bakiye Hareketleri</h1><p class="muted">Bakiyendeki her artış ve azalışın kaynağını görüntüle.</p></div><a class="btn secondary" href="dashboard.html">Dashboard</a></div><section class="panel"><div id="rows" style="display:grid;gap:10px">Yükleniyor...</div></section></main></div><script>const token=localStorage.getItem('safepays_api_token')||'';const rows=document.getElementById('rows');function money(n){return Number(n||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:8})+' USDT'}function dt(v){return new Date(v).toLocaleString('tr-TR')}fetch('/api/ledger',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(d=>{if(!d.ledger)throw new Error();rows.innerHTML=d.ledger.map(x=>`<div style="border:1px solid #e2e9f1;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b>${x.reason}</b><div style="color:#7d8b9e;font-size:12px;margin-top:5px">${dt(x.createdAt)} · ${x.transactionId||'Bakiye açılışı'}</div></div><div style="text-align:right"><b style="color:${x.direction==='credit'?'#138654':'#d74754'}">${x.direction==='credit'?'+':'-'}${money(x.amount)}</b><div style="color:#7d8b9e;font-size:11px;margin-top:5px">${money(x.balanceBefore)} → ${money(x.balanceAfter)}</div></div></div>`).join('')||'<div class="muted">Henüz bakiye hareketi yok.</div>'}).catch(()=>rows.innerHTML='<div class="muted">Bakiye hareketleri alınamadı.</div>');</script><script src="assets/member-premium.js?v=8" defer></script></body></html>
