<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafePays — Kazançlar</title><link rel="stylesheet" href="assets/styles.css"><style>body{background:#071426;color:#edf5ff}.wrap{max-width:800px;margin:6vh auto;padding:24px}.card{background:#10233a;border:1px solid #24405d;border-radius:18px;padding:24px;margin:14px 0}.muted{color:#9bb0c8}.value{font-size:28px;font-weight:850}</style><link rel="stylesheet" href="assets/member-premium.css?v=12"></head><body><main class="wrap"><p class="muted">HESAP</p><h1>Kazanç özeti</h1><section class="card"><p class="muted">Gerçek hesap bakiyesi</p><div class="value" id="balance">Yükleniyor…</div></section><section class="card"><p class="muted">Kaydedilmiş referans kazancı</p><div class="value" id="referral">—</div></section><section class="card"><b>Bonus ve kampanyalar</b><p class="muted">Bu hesapta otomatik bonus veya komisyon dağıtımı etkin değil. Gerçekleşmemiş ödül veya komisyon gösterilmez.</p><a href="events.html">Yayınlanmış duyuruları gör</a></section><p><a href="dashboard.html">Panele dön</a></p></main><script>(async()=>{const token=localStorage.getItem('safepays_api_token')||'';if(!token){location.href='login.html';return}try{const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok)throw Error();document.getElementById('balance').textContent=Number(d.user.balance||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:8})+' USDT';document.getElementById('referral').textContent=Number(d.user.referralEarnings||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:8})+' USDT'}catch(e){document.getElementById('balance').textContent='Veri alınamadı'}})();</script><script src="assets/member-premium.js?v=10" defer></script></body></html>
